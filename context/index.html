<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Context turns your messy thoughts into useful, structured outcomes — emails, plans, task lists and more." />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Context — Your messy thoughts. Made useful.</title>
    <script>
      // Prevent theme flash: apply saved theme before React mounts.
      try {
        var t = localStorage.getItem('context-theme') || 'dark'
        document.documentElement.classList.toggle('dark', t !== 'light')
        document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
